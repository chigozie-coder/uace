[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uace"
version = "0.2.0"
description = "Universal Auto-Caption Engine - Advanced speech recognition with novel parallel diarization"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Chigozie Anyaeji", email = "chigozieanyaeji@gmail.com"}
]
keywords = [
    "captions",
    "subtitles",
    "whisper",
    "transcription",
    "video",
    "accessibility",
    "motion-typography",
    "diarization",
    "speaker-identification",
    "speech-recognition",
    "parallel-processing"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "click>=8.0.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
# Basic transcription engines
whisper = [
    "faster-whisper>=1.0.0",
    "torch>=2.0.0",
]

whisperx = [
    "whisperx>=3.1.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
]

distil = [
    "transformers>=4.30.0",
    "torch>=2.0.0",
]

# HyperFast engine (novel parallel pipeline)
hyperfast = [
    "faster-whisper>=1.0.0",
    "torch>=2.0.0",
    "librosa>=0.10.0",
    "scikit-learn>=1.3.0",
    "speechbrain>=0.5.0",
]

# HyperFast V2 (improved accuracy with audio enhancement)
hyperfast-v2 = [
    "faster-whisper>=1.0.0",
    "torch>=2.0.0",
    "librosa>=0.10.0",
    "scikit-learn>=1.3.0",
    "speechbrain>=0.5.0",
    "noisereduce>=3.0.0",  # Audio denoising
]

# HyperFast Pro (smart ensemble with Pyannote fallback)
hyperfast-pro = [
    "faster-whisper>=1.0.0",
    "torch>=2.0.0",
    "librosa>=0.10.0",
    "scikit-learn>=1.3.0",
    "speechbrain>=0.5.0",
    "noisereduce>=3.0.0",
    "pyannote.audio>=3.1.0",  # Optional fallback for uncertain segments
]

# Diarization options
diarization = [
    "pyannote.audio>=3.1.0",
    "torch>=2.0.0",
]

# Video processing
video = [
    "ffmpeg-python>=0.2.0",
]

# Complete installation (all engines + features)
all = [
    "faster-whisper>=1.0.0",
    "whisperx>=3.1.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "librosa>=0.10.0",
    "scikit-learn>=1.3.0",
    "speechbrain>=0.5.0",
    "noisereduce>=3.0.0",
    "pyannote.audio>=3.1.0",
    "ffmpeg-python>=0.2.0",
]

# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.12.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "ipython>=8.0.0",
]

# Documentation
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/chigozie-coder/uace"
Documentation = "https://github.com/chigozie-coder/uace/blob/main/docs"
Repository = "https://github.com/chigozie-coder/uace"
Issues = "https://github.com/chigozie-coder/uace/issues"
Changelog = "https://github.com/chigozie-coder/uace/blob/main/CHANGELOG.md"

[project.scripts]
uace = "uace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uace = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py39']
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.ruff]
line-length = 100
target-version = "py39"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"tests/*" = ["F401", "F811"]  # Allow unused imports and redefinition in tests

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Allow gradual typing
ignore_missing_imports = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "faster_whisper.*",
    "whisperx.*",
    "torch.*",
    "torchaudio.*",
    "librosa.*",
    "speechbrain.*",
    "pyannote.*",
    "deepfilternet.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--cov=uace",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "-ra",  # Show summary of all test outcomes
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "hyperfast: marks tests for HyperFast engine",
    "diarization: marks tests requiring diarization models",
    "gpu: marks tests requiring GPU",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src/uace"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
